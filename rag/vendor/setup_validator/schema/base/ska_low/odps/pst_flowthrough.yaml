params:
  centralFrequency:
  - minmax
  - min: 50 MHz
    max: 350 MHz
    unit: MHz
  bandwidth:
  - minmax
  - min: 3.6 kHz
    max: 75 MHz
    unit: MHz
  bitDepth:
  - oneof
  - allowed_values:
    - 1
    - 2
    - 4
    - 8
    - 16
  n_polarization:
  - minmax
  - min: 1
    max: 2
    step: 1
    unit: ''
  data_rate:
  - minmax
  - min: 0 Gbyte/s
    max: 0.5 Gbyte/s
    unit: Gbyte/s
docs:
  centralFrequency: Beam centre frequency (MHz)
  bandwidth: Beam bandwidth (MHz)
  bitDepth: Bit depth
  n_polarization: Number of polarizations to record (1 or 2)
  data_rate: Estimated data rate (GB/s)
